name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # 也允许在 GitHub 网页上手动点一次「Run workflow」重新发布
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 纯静态站点 + Cloudflare Pages Functions，无构建步骤，直接直传整个目录
      - name: Deploy
        run: npx wrangler pages deploy . --project-name=prompt-studio-pwa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
