<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>已并入 Prompt Studio · 正在跳转…</title>
<meta name="theme-color" content="#0F1115" />
<meta http-equiv="refresh" content="0; url=/#/ops" />
<style>
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
       background:#0F1115;color:#E8EAED;
       font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif}
  .box{text-align:center;padding:32px}
  .t{font-size:17px;font-weight:600}
  .s{margin-top:8px;font-size:13px;color:#9AA0A6}
  a{margin-top:18px;display:inline-block;color:#4F8CFF;font-size:14px;text-decoration:none}
</style>
<script>
  /* PromptOps 已并入 Prompt Studio。
     老地址 /ops/ 与 /ops/xxx 一律跳到主应用对应的 hash 路由，
     不再独立启动一份应用 —— 否则会注册 scope=/ops/ 的 SW，
     与主应用抢占 /ops/js/*、/ops/css/* 这些现在共用的资源。 */
  (function () {
    var sub = location.pathname.replace(/^\/ops\/?/, '').replace(/\/+$/, '');
    location.replace('/#' + (sub ? '/ops/' + sub : '/ops'));
  })();
</script>
</head>
<body>
  <div class="box">
    <div class="t">PromptOps 已并入 Prompt Studio</div>
    <div class="s">正在跳转到「评测」…</div>
    <a href="/#/ops">如果没自动跳转，点这里</a>
  </div>
</body>
</html>
